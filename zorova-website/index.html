<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zorova E-Commerce Website</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #06101f;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #ffffff;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      text-align: center;
    }

    .project-image {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    /* Fallback style in case no image extension exists */
    .image-error {
      padding: 40px;
      background: #0d1b2a;
      border: 2px dashed #4a5568;
      border-radius: 8px;
      color: #a0aec0;
    }
  </style>
</head>
<body>

  <div class="container">
    <img
      src="BE.02.jpeg"
      alt="Zorova E-Commerce Website Project"
      class="project-image"
      onerror="
        if (!this.dataset.triedPng) {
          this.dataset.triedPng = 'true';
          this.src = 'BE.02.png';
        } else if (!this.dataset.triedJpg) {
          this.dataset.triedJpg = 'true';
          this.src = 'BE.02.jpg';
        } else {
          this.onerror = null;
          this.insertAdjacentHTML('afterend', '<div class=\'image-error\'><p>Image could not be loaded. Please verify the file path.</p></div>');
          this.style.display = 'none';
        }
      "
    >
  </div>

  <script>
    (function () {
      var image = document.querySelector('.project-image');
      if (!image) return;

      var targetRotateX = 0;
      var targetRotateY = 0;
      var currentRotateX = 0;
      var currentRotateY = 0;
      var currentFloatY = 0;
      var isInteracting = false;
      var time = 0;

      var MAX_TILT = 8;

      // Desktop: mouse-based interactive tilt
      if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
        image.addEventListener('mousemove', function (event) {
          var rect = image.getBoundingClientRect();
          var offsetX = (event.clientX - rect.left) / rect.width - 0.5;
          var offsetY = (event.clientY - rect.top) / rect.height - 0.5;
          targetRotateY = offsetX * MAX_TILT * 2;
          targetRotateX = -offsetY * MAX_TILT * 2;
          isInteracting = true;
        });

        image.addEventListener('mouseleave', function () {
          targetRotateX = 0;
          targetRotateY = 0;
          isInteracting = false;
        });
      }

      // Mobile: touch-based interactive tilt
      if (window.matchMedia('(hover: none), (pointer: coarse)').matches) {
        image.addEventListener('touchstart', function (event) {
          var touch = event.touches[0];
          if (touch) {
            var rect = image.getBoundingClientRect();
            var offsetX = (touch.clientX - rect.left) / rect.width - 0.5;
            var offsetY = (touch.clientY - rect.top) / rect.height - 0.5;
            targetRotateY = offsetX * MAX_TILT * 2;
            targetRotateX = -offsetY * MAX_TILT * 2;
            isInteracting = true;
          }
        });

        image.addEventListener('touchmove', function (event) {
          var touch = event.touches[0];
          if (touch) {
            var rect = image.getBoundingClientRect();
            var offsetX = (touch.clientX - rect.left) / rect.width - 0.5;
            var offsetY = (touch.clientY - rect.top) / rect.height - 0.5;
            targetRotateY = offsetX * MAX_TILT * 2;
            targetRotateX = -offsetY * MAX_TILT * 2;
          }
        });

        image.addEventListener('touchend', function () {
          targetRotateX = 0;
          targetRotateY = 0;
          isInteracting = false;
        });
      }

      // Same 3D animation as the portfolio pages:
      // always-visible gentle auto-tilt oscillation
      // plus the continuous float animation.
      function animate() {
        time += 0.016;
        currentRotateX += (targetRotateX - currentRotateX) * 0.08;
        currentRotateY += (targetRotateY - currentRotateY) * 0.08;

        var autoTiltX = Math.sin(time * 0.4) * 3;
        var autoTiltY = Math.cos(time * 0.3) * 4;
        var effectiveRotateX = currentRotateX + autoTiltX;
        var effectiveRotateY = currentRotateY + autoTiltY;

        var floatAmplitude = isInteracting ? 4 : 6;
        var floatSpeed = isInteracting ? 1.2 : 0.8;
        var targetFloatY = Math.sin(time * floatSpeed) * floatAmplitude;
        currentFloatY += (targetFloatY - currentFloatY) * 0.05;
        image.style.transform =
          'perspective(1200px) ' +
          'rotateX(' + effectiveRotateX.toFixed(3) + 'deg) ' +
          'rotateY(' + effectiveRotateY.toFixed(3) + 'deg) ' +
          'translateY(' + currentFloatY.toFixed(3) + 'px)';
        requestAnimationFrame(animate);
      }
      animate();
    })();
  </script>
</body>
</html>
