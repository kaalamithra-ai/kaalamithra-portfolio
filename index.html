<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Kaalamithra AI Tech Solution | Company Portfolio</title>

    <link rel="stylesheet" href="style.css?v=9">
    <link rel="stylesheet" href="add_desktop_links.css?v=9">

    <style>
        /* Letter-by-letter reveal frosts (temporary overlay layers).
           They blur the baked-in company name and "Company Portfolio"
           text regions and un-blur left to right so the existing text
           appears one letter at a time. No text, logo, image, or
           layout is added or changed; layers remove themselves. */
        .reveal-frost {
            position: absolute;
            display: none;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            pointer-events: none;
            z-index: 2;
            transition: width 130ms ease-out;
        }

        /* Desktop/tablet regions measured from
           images/company-portfolio.jpg (1600x900) */
        @media (min-width: 601px) {
            .reveal-frost {
                display: block;
            }

            .reveal-frost[data-reveal="kaala"] {
                left: 18.8%; top: 13.4%; width: 24.9%; height: 9.0%;
            }

            .reveal-frost[data-reveal="mithra"] {
                left: 19.8%; top: 22.4%; width: 26.1%; height: 8.4%;
            }

            .reveal-frost[data-reveal="company"] {
                left: 9.5%; top: 41.6%; width: 27.1%; height: 9.7%;
            }

            .reveal-frost[data-reveal="portfolio"] {
                left: 9.5%; top: 51.0%; width: 28.5%; height: 12.0%;
            }
        }

        /* Mobile: the hero shows images/prot.2.jpeg fitted with
           "contain"; the reveal script measures that fitted box and
           positions the layers over its text regions in pixels. */
    </style>
</head>

<body>

    <main class="portfolio-page">

        <section class="portfolio-hero">

            <!-- =====================================
                 PORTFOLIO IMAGE + SERVICE LINKS WRAPPER
                 The image and every service link live in
                 the SAME container. The desktop tilt/float
                 animation transforms this wrapper, so the
                 image and its clickable areas always move
                 together and stay exactly aligned.
            ====================================== -->

            <div class="portfolio-image-wrapper">

                <!-- Company Portfolio Image -->
                <img
                    src="images/company-portfolio.jpg"
                    alt="Kaalamithra AI Tech Solution Company Portfolio"
                    class="portfolio-image"
                >

                <!-- Letter-by-letter reveal frosts for the existing
                     company name and "Company Portfolio" text.
                     Overlay layers only - no new content. -->
                <div class="reveal-frost" data-reveal="kaala"></div>
                <div class="reveal-frost" data-reveal="mithra"></div>
                <div class="reveal-frost" data-reveal="company"></div>
                <div class="reveal-frost" data-reveal="portfolio"></div>


                <!-- =====================================
                     AI & AUTOMATION SOLUTIONS
                ====================================== -->

                <a
                    href="ai-automation.html"
                    class="ai-automation-link"
                    aria-label="AI and Automation Solutions"
                    title="AI & Automation Solutions"
                >
                </a>


                <!-- =====================================
                     WEB & APP DEVELOPMENT
                ====================================== -->

                <a
                    href="web-app-development.html"
                    class="web-app-development-link"
                    aria-label="Web and App Development"
                    title="Web & App Development"
                >
                </a>


                <!-- =====================================
                     SERVICE 3
                ====================================== -->

                <a
                    href="ecommerce.html"
                    class="service-3-link"
                    aria-label="E-Commerce Solutions"
                    title="E-Commerce Solutions"
                >
                </a>


                <!-- =====================================
                     SERVICE 4
                ====================================== -->

                <a
                    href="service-4.html"
                    class="service-4-link"
                    aria-label="Service 4"
                    title="Service 4"
                >
                </a>


                <!-- =====================================
                     SERVICE 5
                ====================================== -->

                <a
                    href="support-maintenance.html"
                    class="service-5-link"
                    aria-label="Support & Maintenance"
                    title="Support & Maintenance"
                >
                </a>

            </div>


            <!-- =====================================
                 PROJECTS BUTTON
            ====================================== -->

            <a
                href="projects.html"
                class="projects-button"
                aria-label="Projects"
            >

                <span class="projects-icon">▣</span>

                <span class="projects-text">
                    Projects
                </span>

            </a>

        </section>

    </main>

    <script>
        (function () {
            // Desktop: mouse-based 3D tilt + always-visible 3D motion.
            // The gentle auto-tilt oscillation and continuous float keep
            // the embedded company logo, "KAALA MITHRA" name and
            // "Company Portfolio" text smoothly animating in 3D even
            // without mouse interaction — exactly like the mobile view.
            if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
                var hero = document.querySelector('.portfolio-hero');
                var wrapper = document.querySelector('.portfolio-image-wrapper');

                if (hero && wrapper) {
                    var targetRotateX = 0;
                    var targetRotateY = 0;
                    var currentRotateX = 0;
                    var currentRotateY = 0;
                    var currentFloatY = 0;
                    var isHovering = false;
                    var time = 0;

                    var MAX_TILT = 4;

                    hero.addEventListener('mousemove', function (event) {
                        var rect = hero.getBoundingClientRect();
                        var offsetX = (event.clientX - rect.left) / rect.width - 0.5;
                        var offsetY = (event.clientY - rect.top) / rect.height - 0.5;
                        targetRotateY = offsetX * MAX_TILT * 2;
                        targetRotateX = -offsetY * MAX_TILT * 2;
                        isHovering = true;
                    });

                    hero.addEventListener('mouseleave', function () {
                        targetRotateX = 0;
                        targetRotateY = 0;
                        isHovering = false;
                    });

                    function animateDesktop() {
                        time += 0.016;
                        currentRotateX += (targetRotateX - currentRotateX) * 0.08;
                        currentRotateY += (targetRotateY - currentRotateY) * 0.08;

                        // Always-visible 3D motion: gentle auto-tilt oscillation
                        // (same as mobile) so the logo, name and portfolio text
                        // continuously float in 3D even when the mouse is idle.
                        // Amplitudes are large enough that the embedded logo,
                        // company name and portfolio text visibly move together
                        // with the 3D image at all times.
                        var autoTiltX = Math.sin(time * 0.4) * 5;
                        var autoTiltY = Math.cos(time * 0.3) * 6;
                        var effectiveRotateX = currentRotateX + autoTiltX;
                        var effectiveRotateY = currentRotateY + autoTiltY;

                        var floatAmplitude = isHovering ? 5 : 8;
                        var floatSpeed = isHovering ? 1.2 : 0.8;
                        var targetFloatY = Math.sin(time * floatSpeed) * floatAmplitude;
                        currentFloatY += (targetFloatY - currentFloatY) * 0.05;

                        // Subtle Z-depth breathing so the 3D motion is clearly visible
                        var depthZ = Math.sin(time * 0.5) * 18;
                        wrapper.style.transform =
                            'perspective(1200px) ' +
                            'rotateX(' + effectiveRotateX.toFixed(3) + 'deg) ' +
                            'rotateY(' + effectiveRotateY.toFixed(3) + 'deg) ' +
                            'translateY(' + currentFloatY.toFixed(3) + 'px) ' +
                            'translateZ(' + depthZ.toFixed(3) + 'px)';
                        requestAnimationFrame(animateDesktop);
                    }
                    animateDesktop();
                }
            }

            // Mobile: 3D tilt + float effect (always visible, plus touch interaction)
            if (window.matchMedia('(hover: none), (pointer: coarse)').matches) {
                var hero = document.querySelector('.portfolio-hero');
                // On mobile the visible image is the hero's background
                // (prot.2.jpeg) because .portfolio-image is hidden.
                // So transform the hero itself for visible 3D motion.
                var wrapper = hero;

                if (hero && wrapper) {
                    var targetRotateX = 0;
                    var targetRotateY = 0;
                    var currentRotateX = 0;
                    var currentRotateY = 0;
                    var currentFloatY = 0;
                    var isTouching = false;
                    var time = 0;

                    var MAX_TILT = 8; // Slightly larger for mobile

                    hero.addEventListener('touchstart', function (event) {
                        var touch = event.touches[0];
                        if (touch) {
                            var rect = hero.getBoundingClientRect();
                            var offsetX = (touch.clientX - rect.left) / rect.width - 0.5;
                            var offsetY = (touch.clientY - rect.top) / rect.height - 0.5;
                            targetRotateY = offsetX * MAX_TILT * 2;
                            targetRotateX = -offsetY * MAX_TILT * 2;
                            isTouching = true;
                        }
                    });

                    hero.addEventListener('touchmove', function (event) {
                        var touch = event.touches[0];
                        if (touch) {
                            var rect = hero.getBoundingClientRect();
                            var offsetX = (touch.clientX - rect.left) / rect.width - 0.5;
                            var offsetY = (touch.clientY - rect.top) / rect.height - 0.5;
                            targetRotateY = offsetX * MAX_TILT * 2;
                            targetRotateX = -offsetY * MAX_TILT * 2;
                        }
                    });

                    hero.addEventListener('touchend', function () {
                        targetRotateX = 0;
                        targetRotateY = 0;
                        isTouching = false;
                    });

                    function animateMobile() {
                        time += 0.016;
                        currentRotateX += (targetRotateX - currentRotateX) * 0.08;
                        currentRotateY += (targetRotateY - currentRotateY) * 0.08;

                        // Always-visible 3D motion: gentle auto-tilt oscillation
                        // plus the same continuous float animation as desktop.
                        // Amplitudes are large enough that the embedded logo,
                        // company name and portfolio text visibly move together
                        // with the 3D image at all times.
                        var autoTiltX = Math.sin(time * 0.4) * 5;
                        var autoTiltY = Math.cos(time * 0.3) * 6;
                        var effectiveRotateX = currentRotateX + autoTiltX;
                        var effectiveRotateY = currentRotateY + autoTiltY;

                        var floatAmplitude = isTouching ? 5 : 8;
                        var floatSpeed = isTouching ? 1.2 : 0.8;
                        var targetFloatY = Math.sin(time * floatSpeed) * floatAmplitude;
                        currentFloatY += (targetFloatY - currentFloatY) * 0.05;

                        // Subtle Z-depth breathing so the 3D motion is clearly visible
                        var depthZ = Math.sin(time * 0.5) * 18;
                        wrapper.style.transform =
                            'perspective(1200px) ' +
                            'rotateX(' + effectiveRotateX.toFixed(3) + 'deg) ' +
                            'rotateY(' + effectiveRotateY.toFixed(3) + 'deg) ' +
                            'translateY(' + currentFloatY.toFixed(3) + 'px) ' +
                            'translateZ(' + depthZ.toFixed(3) + 'px)';
                        requestAnimationFrame(animateMobile);
                    }
                    animateMobile();
                }
            }
        })();
    </script>

    <script>
        (function () {
            // Letter-by-letter reveal for the existing baked-in text.
            // Each frosted cover shrinks one letter-width at a time,
            // left to right, so the text appears sequentially.
            // Works on desktop (company-portfolio.jpg) and on mobile
            // (prot.2.jpeg hero background). The existing 3D motion
            // is not modified.
            var img = document.querySelector('.portfolio-image');
            var hero = document.querySelector('.portfolio-hero');
            if (!hero) return;

            // prot.2.jpeg natural size (mobile hero background)
            var MBG_W = 756, MBG_H = 1600;

            // Desktop line widths in wrapper-% (CSS places the layers)
            var DESKTOP_LINES = [
                { id: 'kaala',     letters: 5, w: 24.9 },
                { id: 'mithra',    letters: 6, w: 26.1 },
                { id: 'company',   letters: 7, w: 27.1 },
                { id: 'portfolio', letters: 9, w: 28.5 }
            ];

            // Mobile text regions as fractions of prot.2.jpeg (measured)
            var MOBILE_LINES = [
                { id: 'kaala',     letters: 5, x: 0.184, y: 0.017, w: 0.217, h: 0.026 },
                { id: 'mithra',    letters: 6, x: 0.184, y: 0.040, w: 0.235, h: 0.024 },
                { id: 'company',   letters: 7, x: 0.099, y: 0.102, w: 0.479, h: 0.055 },
                { id: 'portfolio', letters: 9, x: 0.102, y: 0.150, w: 0.500, h: 0.051 }
            ];

            function isMobileView() {
                return !img || !img.offsetWidth || !img.offsetHeight;
            }

            // Fitted "contain" box of the mobile hero background image
            function mobileBox() {
                var hw = hero.offsetWidth, hh = hero.offsetHeight;
                var scale = Math.min(hw / MBG_W, hh / MBG_H);
                var dw = MBG_W * scale, dh = MBG_H * scale;
                return { ox: (hw - dw) / 2, oy: (hh - dh) / 2, dw: dw, dh: dh };
            }

            function placeMobile(el, line) {
                var b = mobileBox();
                el.style.left = (b.ox + line.x * b.dw) + 'px';
                el.style.top = (b.oy + line.y * b.dh) + 'px';
                el.style.height = (line.h * b.dh) + 'px';
                el.style.display = 'block';
            }

            function revealLine(line, done) {
                var el = document.querySelector('.reveal-frost[data-reveal="' + line.id + '"]');
                if (!el) { done(); return; }
                if (isMobileView()) {
                    placeMobile(el, line);
                }
                var step = 0;
                var timer = setInterval(function () {
                    step++;
                    if (step >= line.letters) {
                        clearInterval(timer);
                        el.style.display = 'none';
                        done();
                    } else if (isMobileView()) {
                        var b = mobileBox();
                        el.style.width = (line.w * b.dw * (1 - step / line.letters)) + 'px';
                    } else {
                        el.style.width = (line.w * (1 - step / line.letters)) + '%';
                    }
                }, 95);
            }

            function start() {
                var lines = isMobileView() ? MOBILE_LINES : DESKTOP_LINES;
                var i = 0;
                function next() {
                    if (i >= lines.length) return;
                    revealLine(lines[i++], next);
                }
                setTimeout(next, 500);
            }

            // Keep any still-visible mobile layer aligned on rotate/resize
            window.addEventListener('resize', function () {
                if (!isMobileView()) return;
                MOBILE_LINES.forEach(function (line) {
                    var el = document.querySelector('.reveal-frost[data-reveal="' + line.id + '"]');
                    if (el && el.style.display === 'block') placeMobile(el, line);
                });
            });

            if (document.readyState === 'complete') {
                start();
            } else {
                window.addEventListener('load', start);
            }
        })();
    </script>

</body>

</html>
