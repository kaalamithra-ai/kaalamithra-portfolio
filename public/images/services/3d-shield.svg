    <path d="M8 14 v-6 a12 12 0 0 1 24 0 v6" stroke="#7C3AED" stroke-width="6" fill="none"/>
    <circle cx="20" cy="28" r="5" fill="#FFFFFF"/>
    <rect x="18" y="30" width="4" height="9" rx="2" fill="#FFFFFF"/>
