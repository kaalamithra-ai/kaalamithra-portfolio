<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/><stop offset="0.55" stop-color="#1D4ED8"/><stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#DB2777"/>
    </linearGradient>
    <linearGradient id="lock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
  </defs>
  <ellipse cx="120" cy="214" rx="82" ry="13" fill="#0B1220" opacity="0.08"/>
  <!-- orbit ring -->
  <ellipse cx="120" cy="126" rx="98" ry="30" stroke="url(#ring)" stroke-width="4" opacity="0.55" transform="rotate(-16 120 126)"/>
  <!-- shield -->
