  <path d="M120 26 L184 52 V112 C184 128 181 143 176 156 L96 38 Z" fill="#FFFFFF" opacity="0.14"/>
  <path d="M120 40 L172 61 V112 C172 154 147 186 120 200 C93 186 68 154 68 112 V61 Z" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="3"/>
  <!-- check -->
  <path d="M94 116 l20 22 l38 -50" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- padlock -->
  <g transform="translate(178 150)">
