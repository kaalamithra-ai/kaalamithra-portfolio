<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kaalamithra AI Tech Solution | Projects</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="ai-page">
        
        <img src="MAA.1.jpeg" alt="Kaalamithra AI Tech Solution Portfolio" class="projects-image">
        
    </main>

    <a href="index.html" class="projects-button">
        <span class="projects-icon">◄</span>
        <span class="projects-text">
            Projects
        </span>
    </a>

    <script>
        (function () {
            var image = document.querySelector('.projects-image');
            if (!image) return;

            var targetRotateX = 0;
            var targetRotateY = 0;
            var currentRotateX = 0;
            var currentRotateY = 0;
            var currentFloatY = 0;
            var isInteracting = false;
            var time = 0;

            var MAX_TILT = 8;

            // Desktop: mouse-based interactive tilt
            if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
                image.addEventListener('mousemove', function (event) {
                    var rect = image.getBoundingClientRect();
                    var offsetX = (event.clientX - rect.left) / rect.width - 0.5;
                    var offsetY = (event.clientY - rect.top) / rect.height - 0.5;
                    targetRotateY = offsetX * MAX_TILT * 2;
                    targetRotateX = -offsetY * MAX_TILT * 2;
                    isInteracting = true;
                });

                image.addEventListener('mouseleave', function () {
                    targetRotateX = 0;
                    targetRotateY = 0;
                    isInteracting = false;
                });
            }

            // Mobile: touch-based interactive tilt
            if (window.matchMedia('(hover: none), (pointer: coarse)').matches) {
                image.addEventListener('touchstart', function (event) {
                    var touch = event.touches[0];
                    if (touch) {
                        var rect = image.getBoundingClientRect();
                        var offsetX = (touch.clientX - rect.left) / rect.width - 0.5;
                        var offsetY = (touch.clientY - rect.top) / rect.height - 0.5;
                        targetRotateY = offsetX * MAX_TILT * 2;
                        targetRotateX = -offsetY * MAX_TILT * 2;
                        isInteracting = true;
                    }
                });

                image.addEventListener('touchmove', function (event) {
                    var touch = event.touches[0];
                    if (touch) {
                        var rect = image.getBoundingClientRect();
                        var offsetX = (touch.clientX - rect.left) / rect.width - 0.5;
                        var offsetY = (touch.clientY - rect.top) / rect.height - 0.5;
                        targetRotateY = offsetX * MAX_TILT * 2;
                        targetRotateX = -offsetY * MAX_TILT * 2;
                    }
                });

                image.addEventListener('touchend', function () {
                    targetRotateX = 0;
                    targetRotateY = 0;
                    isInteracting = false;
                });
            }

            // Same 3D animation on desktop AND mobile:
            // always-visible gentle auto-tilt oscillation
            // plus the continuous float animation.
            function animate() {
                time += 0.016;
                currentRotateX += (targetRotateX - currentRotateX) * 0.08;
                currentRotateY += (targetRotateY - currentRotateY) * 0.08;

                var autoTiltX = Math.sin(time * 0.4) * 3;
                var autoTiltY = Math.cos(time * 0.3) * 4;
                var effectiveRotateX = currentRotateX + autoTiltX;
                var effectiveRotateY = currentRotateY + autoTiltY;

                var floatAmplitude = isInteracting ? 4 : 6;
                var floatSpeed = isInteracting ? 1.2 : 0.8;
                var targetFloatY = Math.sin(time * floatSpeed) * floatAmplitude;
                currentFloatY += (targetFloatY - currentFloatY) * 0.05;
                image.style.transform =
                    'perspective(1200px) ' +
                    'rotateX(' + effectiveRotateX.toFixed(3) + 'deg) ' +
                    'rotateY(' + effectiveRotateY.toFixed(3) + 'deg) ' +
                    'translateY(' + currentFloatY.toFixed(3) + 'px)';
                requestAnimationFrame(animate);
            }
            animate();

            // Click handler for VIEW PROJECT buttons (all three project cards)
            image.addEventListener('click', function (e) {
                var rect = image.getBoundingClientRect();
                
                // Calculate click position relative to image (as percentages)
                var clickXPercent = ((e.clientX - rect.left) / rect.width) * 100;
                var clickYPercent = ((e.clientY - rect.top) / rect.height) * 100;
                
                // Project 01: Annadaata Traders ("VIEW PROJECT ->" area)
                // Region calibrated to the actual button position on MAA.1.jpeg (y ~45.3-46.0%)
                if (clickXPercent >= 2 && clickXPercent <= 20 &&
                    clickYPercent >= 43 && clickYPercent <= 48) {
                    window.location.href = 'projects/annadaata/index.html';
                    return;
                }

                // Project 02: JB and Co. ("VIEW PROJECT ->" area)
                // Region calibrated to the actual button position on MAA.1.jpeg (y ~68.2-68.9%)
                if (clickXPercent >= 2 && clickXPercent <= 20 &&
                    clickYPercent >= 66 && clickYPercent <= 71) {
                    window.location.href = 'JB-and-Co-Website/index.html';
                    return;
                }

                // Project 03: Zorova ("VIEW PROJECT ->" area)
                // Region calibrated to the actual button position on MAA.1.jpeg (y ~90.9-91.6%)
                if (clickXPercent >= 2 && clickXPercent <= 20 &&
                    clickYPercent >= 89 && clickYPercent <= 94) {
                    window.location.href = 'zorova-website/index.html';
                    return;
                }
            });
        })();
    </script>
</body>
</html>
